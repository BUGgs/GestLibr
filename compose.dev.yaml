services:
  web:
    build:
      target: base
    command: ["/usr/local/bin/boot-dev.sh"]
    ports:
      - "${WEB_PORT:-8080}:80"
    volumes:
      - ./web:/var/www/html
      - ./docker/php/conf.d/dev.ini:/usr/local/etc/php/conf.d/zz-dev.ini:ro

  mysql:
    ports:
      - "${MYSQL_PORT:-3306}:3306"

  phpmyadmin:
    ports:
      - "${PHPMYADMIN_BIND_ADDRESS:-0.0.0.0}:${PHPMYADMIN_PORT:-8081}:80"
